name: Build Android Debug APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install & Build Web Assets + Sync Capacitor
        working-directory: mobile-android
        run: |
          npm install --no-audit --no-fund
          npm run cap:sync

      - name: Build Android Debug APK
        working-directory: mobile-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PaperPocket-Android-debug-apk
          path: mobile-android/android/app/build/outputs/apk/debug/app-debug.apk
